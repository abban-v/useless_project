<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Stone gradient -->
    <linearGradient id="stoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e9e9e"/>
      <stop offset="40%" stop-color="#616161"/>
      <stop offset="85%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>

    <!-- Gigachad jaw shadow -->
    <linearGradient id="jawShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#757575"/>
      <stop offset="100%" stop-color="#1b1b1b"/>
    </linearGradient>

    <!-- Vine boom shockwave glow -->
    <radialGradient id="boomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffcc00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Vine Boom Shockwave Aura behind Moai -->
  <circle cx="250" cy="250" r="230" fill="url(#boomGlow)"/>
  <ellipse cx="250" cy="250" rx="210" ry="210" fill="none" stroke="#ff0055" stroke-width="4" stroke-dasharray="20,15" opacity="0.6"/>

  <!-- Moai Head Silhouette with Chiseled Gigachad Jaw -->
  <path d="M 210 50 
           C 240 45 280 48 300 55 
           C 310 90 315 130 310 180 
           L 340 210 
           C 350 250 355 290 345 320 
           L 360 380 
           C 365 420 330 450 270 455 
           C 200 455 160 425 155 385 
           L 170 320 
           C 160 270 165 200 175 140 
           C 185 90 195 60 210 50 Z" 
        fill="url(#stoneBody)" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>

  <!-- Heavy Stone Brow Ridge (The Chad Glare) -->
  <path d="M 175 150 L 325 150 L 315 175 L 185 175 Z" fill="#212121" stroke="#000000" stroke-width="3"/>

  <!-- Deep Shadowed Eye Sockets -->
  <!-- Left Eye Socket -->
  <polygon points="190,175 240,175 235,205 195,200" fill="#0d0d0d"/>
  <ellipse cx="215" cy="190" rx="4" ry="3" fill="#ffffff" opacity="0.85"/>

  <!-- Right Eye Socket -->
  <polygon points="265,175 315,175 305,200 265,205" fill="#0d0d0d"/>
  <ellipse cx="285" cy="190" rx="4" ry="3" fill="#ffffff" opacity="0.85"/>

  <!-- Giant Moai Nose Bridge -->
  <polygon points="240,175 265,175 275,300 225,300" fill="#757575" stroke="#212121" stroke-width="4"/>
  <!-- Nose Tip & Nostrils -->
  <path d="M 215 300 L 285 300 L 275 320 L 225 320 Z" fill="#424242" stroke="#1a1a1a" stroke-width="3"/>
  <ellipse cx="235" cy="315" rx="7" ry="4" fill="#0a0a0a"/>
  <ellipse cx="265" cy="315" rx="7" ry="4" fill="#0a0a0a"/>

  <!-- Stone Cheekbone Sculpting Lines -->
  <path d="M 185 240 L 220 280 M 320 240 L 285 280" stroke="#212121" stroke-width="5" stroke-linecap="round"/>

  <!-- Iconic Pouting Moai / Chad Lips -->
  <path d="M 215 350 Q 250 345 285 350 L 280 365 Q 250 360 220 365 Z" fill="#212121" stroke="#000000" stroke-width="3"/>
  <path d="M 220 368 Q 250 365 280 368 L 275 385 Q 250 380 225 385 Z" fill="#303030" stroke="#000000" stroke-width="3"/>

  <!-- UNHINGED CHISELED CHAD JAWLINE (Angular polygon cuts) -->
  <polygon points="170,390 250,445 190,430" fill="url(#jawShadow)" stroke="#111111" stroke-width="3"/>
  <polygon points="340,390 250,445 310,430" fill="url(#jawShadow)" stroke="#111111" stroke-width="3"/>
  <!-- Chin cleft -->
  <line x1="250" y1="420" x2="250" y2="445" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Sigma Sparkles around the jaw -->
  <polygon points="140,360 145,375 160,380 145,385 140,400 135,385 120,380 135,375" fill="#ffeb3b"/>
  <polygon points="360,340 365,355 380,360 365,365 360,380 355,365 340,360 355,355" fill="#ffeb3b"/>
</svg>
