<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Bone gradient -->
    <radialGradient id="boneGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8eaf6"/>
      <stop offset="85%" stop-color="#9fa8da"/>
      <stop offset="100%" stop-color="#3949ab"/>
    </radialGradient>

    <!-- Laser eye glow -->
    <radialGradient id="laserCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff1744"/>
      <stop offset="70%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="laserBeamLeft" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="laserBeamRight" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Laser Beams Shooting Forward from Eye Sockets -->
  <polygon points="180,210 0,430 80,500 195,225" fill="url(#laserBeamLeft)" opacity="0.85"/>
  <polygon points="320,210 500,430 420,500 305,225" fill="url(#laserBeamRight)" opacity="0.85"/>

  <!-- Cranium Silhouette -->
  <path d="M 120 220 
           C 110 110 170 50 250 50 
           C 330 50 390 110 380 220 
           C 375 270 345 285 340 330 
           C 335 365 315 375 305 375 
           L 195 375 
           C 185 375 165 365 160 330 
           C 155 285 125 270 120 220 Z" 
        fill="url(#boneGrad)" stroke="#1a237e" stroke-width="8" stroke-linejoin="round"/>

  <!-- Cheekbone Indentations -->
  <path d="M 130 250 C 160 270 170 310 160 335" stroke="#3949ab" stroke-width="5" fill="none"/>
  <path d="M 370 250 C 340 270 330 310 340 335" stroke="#3949ab" stroke-width="5" fill="none"/>

  <!-- Forehead Cracks -->
  <path d="M 230 70 L 245 110 L 235 135 L 255 155" stroke="#1a237e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 245 110 L 260 120" stroke="#1a237e" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eye Sockets (Deep black chasms with fiery cores) -->
  <!-- Left Eye Socket -->
  <ellipse cx="185" cy="210" rx="42" ry="48" fill="#000000" stroke="#1a237e" stroke-width="4" transform="rotate(-6 185 210)"/>
  <circle cx="185" cy="210" r="32" fill="url(#laserCore)"/>
  <circle cx="185" cy="210" r="10" fill="#ffffff"/>

  <!-- Right Eye Socket -->
  <ellipse cx="315" cy="210" rx="42" ry="48" fill="#000000" stroke="#1a237e" stroke-width="4" transform="rotate(6 315 210)"/>
  <circle cx="315" cy="210" r="32" fill="url(#laserCore)"/>
  <circle cx="315" cy="210" r="10" fill="#ffffff"/>

  <!-- Upside Down Heart Nose Cavity -->
  <path d="M 250 260 
           C 240 240 228 260 235 285 
           L 250 305 
           L 265 285 
           C 272 260 260 240 250 260 Z" 
        fill="#000000" stroke="#1a237e" stroke-width="4"/>

  <!-- Upper Jaw / Teeth Base -->
  <rect x="180" y="345" width="140" height="75" rx="10" fill="#e8eaf6" stroke="#1a237e" stroke-width="6"/>

  <!-- Grinning Skull Teeth (Sharp, individual, menacing) -->
  <!-- Upper Row -->
  <rect x="190" y="348" width="18" height="32" rx="4" fill="#ffffff" stroke="#1a237e" stroke-width="2.5"/>
  <rect x="213" y="348" width="18" height="34" rx="4" fill="#ffffff" stroke="#1a237e" stroke-width="2.5"/>
  <rect x="236" y="348" width="28" height="35" rx="4" fill="#ffffff" stroke="#1a237e" stroke-width="2.5"/>
  <rect x="269" y="348" width="18" height="34" rx="4" fill="#ffffff" stroke="#1a237e" stroke-width="2.5"/>
  <rect x="292" y="348" width="18" height="32" rx="4" fill="#ffffff" stroke="#1a237e" stroke-width="2.5"/>

  <!-- Lower Row -->
  <rect x="193" y="383" width="17" height="30" rx="4" fill="#e0e0e0" stroke="#1a237e" stroke-width="2.5"/>
  <rect x="215" y="383" width="17" height="32" rx="4" fill="#e0e0e0" stroke="#1a237e" stroke-width="2.5"/>
  <rect x="237" y="383" width="26" height="33" rx="4" fill="#e0e0e0" stroke="#1a237e" stroke-width="2.5"/>
  <rect x="268" y="383" width="17" height="32" rx="4" fill="#e0e0e0" stroke="#1a237e" stroke-width="2.5"/>
  <rect x="290" y="383" width="17" height="30" rx="4" fill="#e0e0e0" stroke="#1a237e" stroke-width="2.5"/>

  <!-- Laser Sparks and Glare Stars -->
  <polygon points="185,180 190,205 215,210 190,215 185,240 180,215 155,210 180,205" fill="#ffffff"/>
  <polygon points="315,180 320,205 345,210 320,215 315,240 310,215 285,210 310,205" fill="#ffffff"/>
</svg>
